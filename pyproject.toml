[project]
name = "personal-ai-local"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "cryptography", "numpy", "sounddevice", "sherpa-onnx", "sentencepiece", "beautifulsoup4", "ddgs", "pypdf", "python-docx", "openpyxl", "playwright"]

[project.scripts]
personal-ai = "assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
